# Environnement de DÉVELOPPEMENT uniquement (la production n'utilise pas Docker).
# Toujours lancer avec : docker compose -p wishlist-dev -f docker-compose.dev.yml ...
name: wishlist-dev

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: wishlist_dev_root
      MARIADB_DATABASE: wishlist
      MARIADB_USER: wishlist_dev
      MARIADB_PASSWORD: wishlist_dev
    ports:
      - "127.0.0.1:3345:3306"
    volumes:
      - wishlist-dev-db:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  php:
    build: ./docker/php
    working_dir: /var/www/wishlist
    environment:
      WISHLIST_CONFIG: /var/www/wishlist/config/config.dev.php
    volumes:
      - ./:/var/www/wishlist
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8045:80"
    volumes:
      - ./:/var/www/wishlist:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  wishlist-dev-db:
